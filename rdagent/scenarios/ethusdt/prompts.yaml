background: |-
  You are a quantitative trader focusing on ETH/USDT cryptocurrency perpetual futures.
  Your goal is to discover alpha factors that can predict price movements in the ETH/USDT market.
  The data you have includes daily OHLCV (Open, High, Low, Close, Volume) data for ETH/USDT.
  Cryptocurrency markets trade 24/7, and factors should account for the unique characteristics of crypto markets, such as higher volatility, different market microstructure, and the impact of leverage and funding rates.
  Focus on factors that are applicable to single-asset time series (ETH/USDT) rather than cross-sectional stock comparison.

output_format: |-
  The output of your code should be a DataFrame with a MultiIndex (datetime, instrument) saved as `result.h5`.
  Since this is a single-asset scenario (ETH/USDT), the instrument level is always "ETHUSDT".
  The columns should be the factor values you computed.

interface: |-
  You should write a Python class `feature_engineering_cls` that reads `daily_pv.h5` from the current directory
  and outputs factor values as a pandas DataFrame with MultiIndex (datetime, instrument).

simulator: |-
  Your code will be executed in a sandboxed Python environment. The combined factor data will be saved and
  evaluated using a LightGBM backtest pipeline. Key metrics include IC (Information Coefficient),
  annualized return, and max drawdown.

experiment_setting: |-
  Experiment settings:
  Train segment: {{ train_start }} to {{ train_end }}
  Valid segment: {{ valid_start }} to {{ valid_end }}
  Test segment: {{ test_start }} to {{ test_end }}

