qlib_init:
    provider_uri: "."
    region: cn

data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2025-11-01 00:00:00", true) }}
    end_time: {{ test_end | default("2026-03-31 23:59:59", true) }}
    instruments: {{ instrument | default("all", true) }}
    data_loader:
        class: StaticDataLoader
        module_path: qlib.data.dataset.loader
        kwargs:
            config: {{ prepared_dataset_file | default("crypto_dataset.parquet", true) }}
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: {{ train_start | default("2025-11-01 00:00:00", true) }}
              fit_end_time: {{ train_end | default("2026-01-31 23:59:59", true) }}
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2025-11-01 00:00:00", true) }}, {{ train_end | default("2026-01-31 23:59:59", true) }}]
                valid: [{{ valid_start | default("2026-02-01 00:00:00", true) }}, {{ valid_end | default("2026-02-28 23:59:59", true) }}]
                test: [{{ test_start | default("2026-03-01 00:00:00", true) }}, {{ test_end | default("2026-03-31 23:59:59", true) }}]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
