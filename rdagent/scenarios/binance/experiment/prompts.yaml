binance_factor_background: |-
  The factor is a characteristic or variable used in quantitative cryptocurrency investment that can help explain the returns and risks of a portfolio or a single asset. Factors are used by investors to identify and exploit sources of excess returns, and they are central to many quantitative investment strategies.
  Each number in the factor represents a numeric value for an instrument (cryptocurrency) at a given hour.
  User will train a model to predict the next 4 hours' return based on the factor values of the previous hours.
  The factor is defined in the following parts:
  1. Name: The name of the factor.
  2. Description: The description of the factor.
  3. Formulation: The formulation of the factor.
  4. Variables: The variables or functions used in the formulation of the factor.
  The factor might not provide all the parts of the information above since some might not be applicable.
  Please specifically give all the hyperparameter in the factors like the window size, look back period, and so on. One factor should statically defines one output with a static source data. For example, last 10 hours momentum and last 20 hours momentum should be two different factors.

  {% if runtime_environment is not none %}
  ====== Runtime Environment ======
  You have following environment to run the code:
  {{ runtime_environment }}
  {% endif %}

binance_factor_interface: |-
  Your python code should follow the interface to better interact with the user's system.
  Your python code should contain the following part: the import part, the function part, and the main part. You should write a main function name: "calculate_{function_name}" and call this function in "if __name__ == __main__" part. Don't write any try-except block in your python code. The user will catch the exception message and provide the feedback to you.
  User will write your python code into a python file and execute the file directly with "python {your_file_name}.py". You should calculate the factor values and save the result into a HDF5(H5) file named "result.h5" in the same directory as your python file. The result file is a HDF5(H5) file containing a pandas dataframe. The index of the dataframe is the "datetime" and "instrument", and the single column name is the factor name,and the value is the factor value. The result file should be saved in the same directory as your python file. IMPORTANT: When saving to HDF5, you MUST use `key="data"`, e.g. `df.to_hdf("result.h5", key="data", mode="w")`. Do NOT use any other key such as "factor" or "df".

  INPUT DATA FORMAT: The input data file "hourly_pv.h5" contains a pandas DataFrame with:
  - Index: pd.MultiIndex with two levels:
    - "datetime" (level 0): Timestamp type, hourly frequency (e.g., Timestamp('2024-01-01 00:00:00'))
    - "instrument" (level 1): str type, cryptocurrency symbol (e.g., 'BTCUSDT', 'ETHUSDT')
  - Columns: $open (float64), $high (float64), $low (float64), $close (float64), $volume (float64)

  OUTPUT DATA FORMAT: The output "result.h5" must have the same MultiIndex structure:
  - Index: pd.MultiIndex with levels ("datetime", "instrument") — datetime is Timestamp, instrument is str
  - Columns: a single column named after your factor, with float64 values

  IMPORTANT NOTES on index handling:
  - "instrument" is an INDEX LEVEL, NOT a column. Use `df.groupby(level='instrument')` or `df.groupby(level=1)` instead of `df.groupby('instrument')`.
  - Do NOT use `reset_index()` unless you immediately restore the MultiIndex afterwards.
  - When iterating over instruments, use `for inst, group in df.groupby(level='instrument')` or `df.xs(inst, level='instrument')`.
  - After computing the factor, ensure the output DataFrame has the exact same MultiIndex (datetime, instrument) as the input.
  - CRITICAL: `df.index.get_level_values('datetime')` returns a DatetimeIndex, NOT a Series. Do NOT use `.dt` accessor on it (e.g., `.dt.floor('h')` will raise AttributeError). Use `.floor('h')` directly on the DatetimeIndex instead.
  - CRITICAL: The output DataFrame must have UNIQUE (datetime, instrument) index pairs. After groupby/merge/resample operations, always verify there are no duplicate indices. If duplicates may occur, use `.groupby(level=['datetime','instrument']).first()` or `df[~df.index.duplicated(keep='first')]` to deduplicate before saving. Duplicate indices will cause downstream errors.

binance_factor_strategy: |-
  Ensure that for every step of data processing, the data format (including indexes) is clearly explained through comments.
  Each transformation or calculation should be accompanied by a detailed description of how the data is structured, especially focusing on key aspects like whether the data has multi-level indexing, how to access specific columns or index levels, and any operations that affect the data shape (e.g., `reset_index()`, `groupby()`, `merge()`).
  This step-by-step explanation will ensure clarity and accuracy in data handling. For example:
  1. **Start with multi-level index**:
    ```python
    # The initial DataFrame has a multi-level index with 'datetime' and 'instrument'.
    # To access the 'datetime' index, use df.index.get_level_values('datetime').
    datetime_values = df.index.get_level_values('datetime')
    ```

  2. **Reset the index if necessary**:
    ```python
    # Resetting the index to move 'datetime' and 'instrument' from the index to columns.
    # This operation flattens the multi-index structure.
    df = df.reset_index()
    ```

  3. **Perform groupby operations**:
    ```python
    # Grouping by 'datetime' and 'instrument' to aggregate the data.
    # After groupby, the result will maintain 'datetime' and 'instrument' as a multi-level index.
    df_grouped = df.groupby(['datetime', 'instrument']).sum()
    ```

  4. **Ensure consistent datetime formats**:
    ```python
    # Before merging, ensure that the 'datetime' column in both DataFrames is of the same format.
    # Convert to datetime format if necessary.
    df['datetime'] = pd.to_datetime(df['datetime'])
    other_df['datetime'] = pd.to_datetime(other_df['datetime'])
    ```

  5. **Merge operations**:
    ```python
    # When merging DataFrames, ensure you are merging on both 'datetime' and 'instrument'.
    # If these are part of the index, reset the index before merging.
    merged_df = pd.merge(df, other_df, on=['datetime', 'instrument'], how='inner')
    ```

binance_factor_output_format: |-
  Your output should be a pandas dataframe similar to the following example information:
  <class 'pandas.core.frame.DataFrame'>
  MultiIndex: 40914 entries, (Timestamp('2024-01-02 00:00:00'), 'BTCUSDT') to (Timestamp('2024-12-31 23:00:00'), 'TIAUSDT')
  Data columns (total 1 columns):
  #   Column            Non-Null Count  Dtype
  ---  ------            --------------  -----
  0   your factor name  40914 non-null  float64
  dtypes: float64(1)
  memory usage: <ignore>
  Notice: The non-null count is OK to be different to the total number of entries since some instruments may not have the factor value on some hours.
  One possible format of `result.h5` may be like following (saved with `key="data"`):
  datetime            instrument
  2024-01-02 00:00:00  BTCUSDT     -0.001796
                       ETHUSDT      0.005780
                       SOLUSDT      0.004228
                       BNBUSDT      0.001298
                       XRPUSDT      0.005330
                                      ...
  2024-12-31 23:00:00  ADAUSDT      0.000000
                       DOGEUSDT     0.002459

binance_factor_simulator: |-
  The factors will be sent into Qlib to train a model to predict the next 4 hours' return based on the factor values of the previous hours.
  Qlib is an AI-oriented quantitative investment platform that aims to realize the potential, empower research, and create value using AI technologies in quantitative investment, from exploring ideas to implementing productions. Qlib supports diverse machine learning modeling paradigms. including supervised learning, market dynamics modeling, and RL.
  User will use Qlib to automatically do the following things:
  1. generate a new factor table based on the factor values.
  2. train a model like LightGBM, CatBoost, LSTM or simple PyTorch model to predict the next 4 hours' return based on the factor values.
  3. build a portfolio based on the predicted return, rebalancing every 4 hours.
  4. evaluate the portfolio's performance including the return, sharpe ratio, max drawdown, and so on.
  Note: The data is cryptocurrency perpetual futures hourly data from Binance, which trades 24/7 without market close.

binance_factor_rich_style_description : |-
  ### R&D Agent-Binance: Automated Crypto Quantitative Trading & Iterative Factors Evolution Demo

  #### [Overview](#_summary)

  The demo showcases the iterative process of hypothesis generation, knowledge construction, and decision-making for cryptocurrency factor investing. It highlights how crypto factors evolve through continuous feedback and refinement.

  #### [Automated R&D](#_rdloops)

  - **[R (Research)](#_research)**
    - Iterative development of ideas and hypotheses for crypto factor alpha.
    - Continuous learning and knowledge construction.

  - **[D (Development)](#_development)**
    - Progressive implementation and code generation of factors.
    - Automated testing and validation of cryptocurrency factors.

  #### [Objective](#_summary)

  To demonstrate the dynamic evolution of cryptocurrency factors through the Qlib platform, emphasizing how each iteration enhances the accuracy and reliability of the resulting factors on Binance perpetual futures hourly data.

