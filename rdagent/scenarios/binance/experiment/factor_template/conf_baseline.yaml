qlib_init:
    provider_uri:
        {{ freq }}: "~/.qlib/qlib_data/crypto_data"
        60min: "~/.qlib/qlib_data/crypto_data"
        1min: "~/.qlib/qlib_data/crypto_data"

market: &market all
benchmark: &benchmark BTCUSDT

data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2024-01-01", true) }}
    end_time: {{ test_end | default("null", true) }}
    instruments: *market
    data_loader:
        class: qlib.contrib.data.loader.Alpha158DL
        kwargs:
            freq: {{ freq }}
            config:
                label:
                    - ["Ref($close, -1)/$close - 1"]
                    - ["LABEL0"]
                feature:
                    - {{ feature_expressions }}
                    - {{ feature_names }}

    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 3
            n_drop: 1
    executor:
        class: SimulatorExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: {{ freq }}
            generate_portfolio_metrics: True
    backtest:
        start_time: {{ test_start | default("2025-01-01", true) }}
        end_time: {{ test_end | default("null", true) }}
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            freq: {{ freq }}
            limit_threshold: 0.0
            deal_price: close
            open_cost: 0.0002
            close_cost: 0.0002
            min_cost: 0

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            freq: {{ freq }}
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2024-01-01", true) }}, {{ train_end | default("2024-09-30", true) }}]
                valid: [{{ valid_start | default("2024-10-01", true) }}, {{ valid_end | default("2024-12-31", true) }}]
                test: [{{ test_start | default("2025-01-01", true) }}, {{ test_end | default("null", true) }}]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: {{ ann_scaler }}
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
